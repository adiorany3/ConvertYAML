name: Router Feedback Sync

on:
  repository_dispatch:
    types: [router_feedback, router_rebuild]
  workflow_dispatch:
    inputs:
      reason:
        description: "Reason for manual router feedback sync"
        required: false
        default: "manual"

permissions:
  contents: write
  actions: write

concurrency:
  group: router-feedback-${{ github.ref }}
  cancel-in-progress: false

jobs:
  router-feedback:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Save dispatch payload
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CLIENT_PAYLOAD: ${{ toJson(github.event.client_payload) }}
          MANUAL_REASON: ${{ inputs.reason }}
        run: |
          set -euo pipefail
          mkdir -p router_feedback
          python - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path

          ts = dt.datetime.now(dt.timezone.utc).strftime("%Y%m%dT%H%M%SZ")
          event_name = os.environ.get("EVENT_NAME", "")
          if event_name == "repository_dispatch":
              raw = os.environ.get("CLIENT_PAYLOAD") or "{}"
              payload = json.loads(raw)
          else:
              payload = {
                  "source": "workflow_dispatch",
                  "reason": os.environ.get("MANUAL_REASON") or "manual",
                  "timestamp_utc": dt.datetime.now(dt.timezone.utc).isoformat(),
              }
          out = Path("router_feedback") / f"dispatch_{ts}.json"
          text = json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True) + "\n"
          out.write_text(text, encoding="utf-8")
          Path("router_feedback/latest_dispatch_payload.json").write_text(text, encoding="utf-8")
          print(f"Saved {out}")
          PY

      - name: Commit router feedback
        shell: bash
        run: |
          set -e
          BRANCH="${GITHUB_REF_NAME:-main}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add router_feedback
          if git diff --cached --quiet; then
            echo "No router feedback changes."
            exit 0
          fi
          git commit -m "chore: store router feedback"
          git fetch origin "$BRANCH"
          git pull --rebase --autostash origin "$BRANCH"
          git push origin "HEAD:$BRANCH"

      - name: Trigger YAML rebuild workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -e
          python - <<'PY'
          import json
          import os
          import urllib.request
          import urllib.error

          repo = os.environ["REPO"]
          branch = os.environ.get("BRANCH") or "main"
          token = os.environ["GH_TOKEN"]
          workflow = "update-yaml-6jam.yml"
          url = f"https://api.github.com/repos/{repo}/actions/workflows/{workflow}/dispatches"
          payload = {"ref": branch}
          req = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
                  "User-Agent": "router-feedback-workflow",
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  print(f"Triggered {workflow}: HTTP {resp.status}")
          except urllib.error.HTTPError as e:
              body = e.read().decode("utf-8", "replace")
              raise SystemExit(f"Failed triggering {workflow}: HTTP {e.code} {body}")
          PY
