name: Update OpenClash YAML setiap 6 jam

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-openclash-yaml-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-yaml:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync branch before generate
        shell: bash
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          git pull --rebase --autostash origin "$BRANCH"

      - name: Generate YAML fast 10 nodes
        env:
          MAX_NODES: "10"
          MIN_OUTPUT_NODES: "10"
          FORCE_WS_ONLY: "true"
          REQUIRE_WS_UPGRADE: "true"
          PREFER_WS: "true"
          EARLY_STOP_GOOD_NODES: "true"
          TEST_BATCH_SIZE: "80"
          CANDIDATE_MULTIPLIER: "35"
          CANDIDATE_MIN: "350"
          RESERVE_POOL_NODES: "10"
          ATTEMPTS: "2"
          REQUIRE_SUCCESSES: "1"
          TCP_TIMEOUT: "2.0"
          FETCH_TIMEOUT: "12"
          MAX_WORKERS: "64"
          FAST_TARGET_MS: "180"
          FILL_DELAY_MS: "900"
          HEALTH_TIMEOUT_MS: "6000"
          RULE_MODE: "Lite"
          TEST_URL: "https://www.gstatic.com/generate_204"
          OUTPUT_ANDROID_YAML: "openclash_android.yaml"
          ANDROID_HEALTH_TIMEOUT_MS: "6000"
          OUTPUT_YAML: "openclash_auto.yaml"
          OUTPUT_CSV: "openclash_auto_report.csv"
          OUTPUT_AKUN: "akun.txt"
          OUTPUT_MANUAL_AKUN: "akun_manual.txt"
          OUTPUT_MANUAL_SKIPPED: "manual_nodes_skipped.txt"
          OUTPUT_STAMP: "last_update.txt"
          MANUAL_NODES_FILE: "manual_nodes.txt"
        run: python generate_yaml.py

      - name: Validate generated YAML
        run: |
          python - <<'PY'
          import sys, yaml
          for path in ["openclash_auto.yaml", "openclash_android.yaml"]:
              with open(path, "r", encoding="utf-8") as f:
                  data = yaml.safe_load(f)
              if not isinstance(data, dict):
                  raise SystemExit(f"{path}: bukan YAML config dict")
              names = {p.get("name") for p in data.get("proxies", []) if isinstance(p, dict)}
              if len(names) != len([p for p in data.get("proxies", []) if isinstance(p, dict)]):
                  raise SystemExit(f"{path}: nama proxy duplikat")
              groups = {g.get("name") for g in data.get("proxy-groups", []) if isinstance(g, dict)}
              refs = names | groups | {"DIRECT", "REJECT", "GLOBAL"}
              for g in data.get("proxy-groups", []):
                  if not isinstance(g, dict):
                      continue
                  for ref in g.get("proxies", []) or []:
                      if ref not in refs:
                          raise SystemExit(f"{path}: proxy-group {g.get('name')} referensi hilang: {ref}")
          print("YAML compatibility check OK")
          PY

      - name: Commit updated YAML
        shell: bash
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openclash_auto.yaml openclash_android.yaml openclash_auto_report.csv akun.txt akun_manual.txt manual_nodes.txt manual_nodes_skipped.txt last_update.txt
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan YAML/report."
            exit 0
          fi
          git commit -m "chore: update OpenClash YAML otomatis"
          git fetch origin "$BRANCH"
          git pull --rebase --autostash origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
