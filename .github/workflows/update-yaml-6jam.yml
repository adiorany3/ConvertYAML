name: Update OpenClash YAML setiap 6 jam

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-openclash-yaml-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-yaml:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Sync branch before generate
        shell: bash
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          git pull --rebase --autostash origin "$BRANCH"

      - name: Download Mihomo core for OpenClash URL test
        shell: bash
        run: |
          MIHOMO_URL=$(python - <<'PY'
          import json
          import urllib.request

          data = json.load(urllib.request.urlopen("https://api.github.com/repos/MetaCubeX/mihomo/releases/latest", timeout=30))
          candidates = []
          for asset in data.get("assets", []):
              name = asset.get("name", "")
              url = asset.get("browser_download_url", "")
              low = name.lower()
              if ("linux-amd64-compatible" in low or "linux-amd64" in low) and low.endswith(".gz") and "debug" not in low:
                  candidates.append((0 if "compatible" in low else 1, name, url))
          if not candidates:
              raise SystemExit("No linux-amd64 mihomo asset found")
          candidates.sort()
          print(candidates[0][2])
          PY
          )
          echo "Download Mihomo: $MIHOMO_URL"
          curl -L "$MIHOMO_URL" -o mihomo.gz
          gunzip -f mihomo.gz
          chmod +x mihomo
          ./mihomo -v || true

      - name: Download sing-box core for NekoBox compatibility test
        shell: bash
        run: |
          SINGBOX_URL=$(python - <<'PY'
          import json
          import urllib.request

          data = json.load(urllib.request.urlopen("https://api.github.com/repos/SagerNet/sing-box/releases/latest", timeout=30))
          candidates = []
          for asset in data.get("assets", []):
              name = asset.get("name", "")
              url = asset.get("browser_download_url", "")
              low = name.lower()
              if "linux-amd64" in low and low.endswith(".tar.gz") and all(x not in low for x in ["debug", ".deb", ".rpm"]):
                  candidates.append((name, url))
          if not candidates:
              raise SystemExit("No linux-amd64 sing-box tar.gz asset found")
          candidates.sort()
          print(candidates[0][1])
          PY
          )
          echo "Download sing-box: $SINGBOX_URL"
          curl -L "$SINGBOX_URL" -o sing-box.tar.gz
          tar -xzf sing-box.tar.gz
          SINGBOX_BIN=$(find . -type f -name sing-box -perm -111 | head -n 1)
          if [ -z "$SINGBOX_BIN" ]; then
            echo "sing-box binary not found"
            exit 1
          fi
          cp "$SINGBOX_BIN" ./sing-box
          chmod +x ./sing-box
          ./sing-box version || true

      - name: Generate YAML with Mihomo and NekoBox tests
        env:
          MAX_NODES: "20"
          MIN_OUTPUT_NODES: "20"
          URLTEST_POOL_NODES: "80"
          NEKOBOX_POOL_NODES: "40"
          ENABLE_STREAMING_DEDICATED_POOL: "true"
          STREAMING_MAX_NODES: "30"
          STREAMING_MIN_OUTPUT_NODES: "12"
          STREAMING_URLTEST_POOL_NODES: "220"
          STREAMING_NEKOBOX_POOL_NODES: "90"
          STREAMING_SUBSCRIPTION_LINKS_FILE: "streaming_subscription_links.txt"
          STREAMING_USE_DEFAULT_LINKS: "true"
          STREAMING_INCLUDE_STANDARD_LINKS: "true"
          STREAMING_ALLOW_STANDARD_FALLBACK: "true"
          STREAMING_CHECK_URLS: "https://www.netflix.com/;https://www.disneyplus.com/;https://www.primevideo.com/;https://www.gstatic.com/generate_204"
          STREAMING_MIN_CHECK_SUCCESSES: "2"
          STREAMING_REAL_CHECK_TEST_URL: "https://www.netflix.com/;https://www.disneyplus.com/;https://www.primevideo.com/;https://www.gstatic.com/generate_204"
          STREAMING_NEKOBOX_TEST_URL: "https://www.netflix.com/;https://www.disneyplus.com/;https://www.primevideo.com/;https://www.gstatic.com/generate_204"
          STREAMING_TEST_URL: "https://www.gstatic.com/generate_204"
          STREAMING_EXPECTED_STATUS: "200,204,301,302,403"
          STREAMING_URL_TEST_EXPECTED_STATUS: "200,204,301,302,403"
          STREAMING_URLTEST_INTERVAL: "45"
          STREAMING_TOLERANCE: "30"
          STREAMING_HEALTH_TIMEOUT_MS: "8000"
          STREAMING_URL_TEST_TIMEOUT_MS: "10000"
          STREAMING_NEKOBOX_TEST_TIMEOUT_MS: "12000"
          OUTPUT_STREAMING_AKUN: "akun_streaming.txt"
          OUTPUT_STREAMING_URLTEST_REPORT: "streaming_urltest_report.csv"
          OUTPUT_STREAMING_NEKOBOX_REPORT: "streaming_nekobox_report.csv"
          ENABLE_INDONESIA_DEDICATED_POOL: "true"
          INDONESIA_MAX_NODES: "20"
          INDONESIA_MIN_OUTPUT_NODES: "6"
          INDONESIA_URLTEST_POOL_NODES: "180"
          INDONESIA_NEKOBOX_POOL_NODES: "70"
          INDONESIA_SUBSCRIPTION_LINKS_FILE: "indonesia_subscription_links.txt"
          INDONESIA_USE_DEFAULT_LINKS: "true"
          INDONESIA_INCLUDE_STANDARD_LINKS: "true"
          INDONESIA_CHECK_URLS: "https://www.tokopedia.com/;https://www.bca.co.id/;https://www.detik.com/;https://www.gstatic.com/generate_204"
          INDONESIA_MIN_CHECK_SUCCESSES: "2"
          INDONESIA_TEST_URL: "https://www.tokopedia.com/"
          INDONESIA_EXPECTED_STATUS: "200,204,301,302,403"
          INDONESIA_URL_TEST_EXPECTED_STATUS: "200,204,301,302,403"
          INDONESIA_URLTEST_INTERVAL: "45"
          INDONESIA_TOLERANCE: "25"
          INDONESIA_HEALTH_TIMEOUT_MS: "8000"
          INDONESIA_URL_TEST_TIMEOUT_MS: "10000"
          INDONESIA_NEKOBOX_TEST_TIMEOUT_MS: "12000"
          INDONESIA_EARLY_STOP_GOOD_NODES: "false"
          OUTPUT_INDONESIA_AKUN: "akun_indonesia.txt"
          OUTPUT_INDONESIA_URLTEST_REPORT: "indonesia_urltest_report.csv"
          OUTPUT_INDONESIA_NEKOBOX_REPORT: "indonesia_nekobox_report.csv"
          REQUIRE_URL_TEST: "true"
          REQUIRE_NEKOBOX_TEST: "true"
          MIHOMO_PATH: "./mihomo"
          SINGBOX_PATH: "./sing-box"
          URL_TEST_URL: "https://www.gstatic.com/generate_204"
          NEKOBOX_TEST_URL: "https://www.gstatic.com/generate_204"
          URL_TEST_EXPECTED_STATUS: "204,200,301,302"
          URL_TEST_TIMEOUT_MS: "6000"
          NEKOBOX_TEST_TIMEOUT_MS: "8000"
          FORCE_WS_ONLY: "true"
          REQUIRE_WS_UPGRADE: "true"
          PREFER_WS: "true"
          EARLY_STOP_GOOD_NODES: "true"
          TEST_BATCH_SIZE: "80"
          CANDIDATE_MULTIPLIER: "35"
          CANDIDATE_MIN: "1200"
          RESERVE_POOL_NODES: "80"
          ATTEMPTS: "2"
          REQUIRE_SUCCESSES: "1"
          TCP_TIMEOUT: "2.0"
          FETCH_TIMEOUT: "12"
          MAX_WORKERS: "64"
          FAST_TARGET_MS: "180"
          FILL_DELAY_MS: "900"
          HEALTH_TIMEOUT_MS: "6000"
          RULE_MODE: "Lite"
          TEST_URL: "https://www.gstatic.com/generate_204"
          OUTPUT_ANDROID_YAML: "openclash_android.yaml"
          ANDROID_HEALTH_TIMEOUT_MS: "6000"
          OUTPUT_YAML: "openclash_auto.yaml"
          OUTPUT_CSV: "openclash_auto_report.csv"
          OUTPUT_URLTEST_REPORT: "urltest_report.csv"
          OUTPUT_NEKOBOX_REPORT: "nekobox_test_report.csv"
          OUTPUT_AKUN: "akun.txt"
          OUTPUT_MANUAL_AKUN: "akun_manual.txt"
          OUTPUT_MANUAL_SKIPPED: "manual_nodes_skipped.txt"
          OUTPUT_STAMP: "last_update.txt"
          MANUAL_NODES_FILE: "manual_nodes.txt"
          MANUAL_UNBLOCK_DOMAINS_FILE: "manual_unblock_domains.txt"
        run: python generate_yaml.py

      - name: Validate generated YAML
        shell: bash
        run: |
          python - <<'PY'
          import yaml
          for path in ["openclash_auto.yaml", "openclash_android.yaml"]:
              with open(path, "r", encoding="utf-8") as f:
                  data = yaml.safe_load(f)
              if not isinstance(data, dict):
                  raise SystemExit(f"{path}: bukan YAML config dict")
              proxy_items = [p for p in data.get("proxies", []) if isinstance(p, dict)]
              names = [p.get("name") for p in proxy_items]
              if len(set(names)) != len(names):
                  raise SystemExit(f"{path}: nama proxy duplikat")
              groups = {g.get("name") for g in data.get("proxy-groups", []) if isinstance(g, dict)}
              refs = set(names) | groups | {"DIRECT", "REJECT", "GLOBAL"}
              for g in data.get("proxy-groups", []) or []:
                  if not isinstance(g, dict):
                      continue
                  for ref in g.get("proxies", []) or []:
                      if ref not in refs:
                          raise SystemExit(f"{path}: proxy-group {g.get('name')} referensi hilang: {ref}")
              if path == "openclash_android.yaml":
                  for forbidden in ["rule-providers", "redir-port", "tproxy-port"]:
                      if forbidden in data:
                          raise SystemExit(f"{path}: tidak boleh punya {forbidden}")
          print("YAML reference compatibility check OK")
          PY
          ./mihomo -t -d . -f openclash_auto.yaml
          ./mihomo -t -d . -f openclash_android.yaml

      - name: Commit updated YAML
        shell: bash
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add openclash_auto.yaml openclash_android.yaml openclash_auto_report.csv urltest_report.csv nekobox_test_report.csv akun.txt akun_manual.txt manual_nodes.txt manual_nodes_skipped.txt manual_unblock_domains.txt last_update.txt akun_streaming.txt streaming_urltest_report.csv streaming_nekobox_report.csv streaming_subscription_links.txt akun_indonesia.txt indonesia_urltest_report.csv indonesia_nekobox_report.csv indonesia_subscription_links.txt
          if git diff --cached --quiet; then
            echo "Tidak ada perubahan YAML/report."
            exit 0
          fi
          git commit -m "chore: update OpenClash YAML otomatis"
          git fetch origin "$BRANCH"
          git pull --rebase --autostash origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
