mixed-port: 7890
allow-lan: false
bind-address: '*'
mode: global
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
keep-alive-interval: 15
keep-alive-idle: 600
disable-keep-alive: false
profile:
  store-selected: true
  store-fake-ip: true
sniffer:
  enable: true
  sniff:
    TLS:
      ports:
      - 443
      - 8443
    HTTP:
      ports:
      - 80
      - 8080-8880
      override-destination: true
  skip-domain:
  - +.lan
  - +.local
dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
  - +.lan
  - +.local
  - localhost.ptlogin2.qq.com
  - dns.msftncsi.com
  - www.msftconnecttest.com
  - connectivitycheck.gstatic.com
  - connect.rom.miui.com
  - time.*.com
  - ntp.*.com
  - +.pool.ntp.org
  - router.asus.com
  - tplinkwifi.net
  - tendawifi.com
  - +.bank*
  - +.bca.co.id
  - +.bni.co.id
  - +.bri.co.id
  - +.mandiri.co.id
  default-nameserver:
  - 1.1.1.1
  - 8.8.8.8
  nameserver:
  - https://1.1.1.1/dns-query
  - https://dns.google/dns-query
