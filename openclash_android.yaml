mixed-port: 7890
allow-lan: false
bind-address: '*'
mode: global
log-level: warning
ipv6: false
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
keep-alive-interval: 15
keep-alive-idle: 600
disable-keep-alive: false
profile:
  store-selected: true
  store-fake-ip: true
sniffer:
  enable: true
  sniff:
    TLS:
      ports:
      - 443
      - 8443
    HTTP:
      ports:
      - 80
      - 8080-8880
      override-destination: true
  skip-domain:
  - +.lan
  - +.local
dns:
