  - +.lan
  - +.local
  - time.*.com
  - ntp.*.com
  default-nameserver:
  - 1.1.1.1
  - 8.8.8.8
  nameserver:
  - https://1.1.1.1/dns-query
  - https://dns.google/dns-query
  fallback:
  - tls://1.1.1.1
  - tls://8.8.8.8
  fallback-filter:
    geoip: true
    geoip-code: ID
    ipcidr:
    - 240.0.0.0/4
